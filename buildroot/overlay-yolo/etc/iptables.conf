# luckfox_buildroot_yolo: loaded by S35iptables at boot.
# adbd always listens on TCP 5555 (compiled in, no option to disable), which
# is an unauthenticated root shell to anyone on the same WiFi/LAN. Drop it on
# every interface; ADB over the USB cable uses functionfs, not TCP, and keeps
# working as the fallback way in.
*filter
:INPUT ACCEPT [0:0]
:FORWARD ACCEPT [0:0]
:OUTPUT ACCEPT [0:0]
-A INPUT -p tcp --dport 5555 ! -i lo -j DROP
COMMIT
