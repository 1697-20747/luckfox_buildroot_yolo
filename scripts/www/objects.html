<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luckfox Objects</title>
<!-- Full object log for the current viewing session (the main page shows
     only the latest 20). The log belongs to the live-stream session: it is
     cleared when the stream viewer disconnects, so this page is opened in a
     new tab while the stream keeps running in the original one. -->
<style>
  :root {
    --bg: #0b0e11; --panel: #12171c; --line: #1f2830; --text: #d6e2ea;
    --dim: #7d8d99; --accent: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .08em; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  a.navlink { margin-left: auto; color: var(--text); text-decoration: none; font-size: 13px;
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
  a.navlink:hover { border-color: var(--accent); }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bar .spacer { flex: 1; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; font-size: 12px; }
  .chip b { color: var(--accent); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .note { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--panel); position: sticky; top: 0; }
  td.num { text-align: right; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 6px; }
  tr.active .dot { background: var(--accent); }
  .empty { color: var(--dim); padding: 16px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>LUCKFOX · OBJECTS</h1>
    <div class="sub">Everything detected this session</div>
  </div>
  <a class="navlink" href="/">← Live stream</a>
</header>
<main>
  <div class="bar">
    <span id="summary" class="mono">–</span>
    <span class="spacer"></span>
    <button id="csvBtn">Download CSV</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="chips" class="bar mono"></div>
  <p class="note">The log belongs to the live-stream session: it clears when the stream viewer disconnects
    or another viewer takes over. Keeps the newest 200 objects. Refreshes every 2 s.</p>
  <div class="wrap">
    <table class="mono">
      <thead><tr><th>#</th><th>Class</th><th class="num">Best</th><th class="num">First seen</th>
        <th class="num">Last seen</th><th class="num">Duration</th><th>Status</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clock = (sec) => { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  let last = null;

  function render(o) {
    last = o;
    $('summary').textContent = !o.streaming && o.total === 0
      ? 'No active session (open the live stream to start one)'
      : o.total + (o.total === 1 ? ' object' : ' objects') + ' · session ' + clock(o.session_s);
    $('chips').innerHTML = Object.entries(o.counts).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => '<span class="chip">' + esc(k) + ' <b>' + v + '</b></span>').join('');
    $('rows').innerHTML = o.objects.length ? o.objects.map((x) =>
      '<tr class="' + (x.active ? 'active' : '') + '">' +
        '<td>' + x.id + '</td><td>' + esc(x.cls) + '</td>' +
        '<td class="num">' + Math.round(x.score * 100) + '%</td>' +
        '<td class="num">' + clock(x.first_s) + '</td><td class="num">' + clock(x.last_s) + '</td>' +
        '<td class="num">' + Math.max(0, x.last_s - x.first_s).toFixed(1) + ' s</td>' +
        '<td><span class="dot"></span>' + (x.active ? 'in view' : 'gone') + '</td></tr>').join('')
      : '<tr><td colspan="7" class="empty">Nothing detected yet.</td></tr>';
  }

  async function refresh() {
    try { render(await fetch('/api/objects', { cache: 'no-store' }).then((r) => r.json())); } catch (e) {}
  }

  $('resetBtn').onclick = async () => {
    if (!confirm('Clear the object list and counts for this session?')) return;
    try { render(await fetch('/api/objects/reset', { cache: 'no-store' }).then((r) => r.json())); } catch (e) {}
  };

  $('csvBtn').onclick = () => {
    if (!last) return;
    const lines = ['id,class,best_score,first_seen_s,last_seen_s,duration_s,in_view'];
    for (const x of [...last.objects].reverse()) {
      lines.push([x.id, x.cls, x.score, x.first_s, x.last_s, (x.last_s - x.first_s).toFixed(1), x.active].join(','));
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
    a.download = 'luckfox-objects-' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
    a.click();
  };

  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
