<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luckfox HUD</title>
<!-- Served by luckfox_video_hud_stream_cam itself (web root: rknn_test/www).
     Fully self-contained: no external fonts/scripts, so it works over the
     USB link with no internet. Single viewer: opening the stream here takes
     it over from any other tab/laptop, which then shows "Take over". -->
<style>
  :root {
    --bg: #0b0e11; --panel: #12171c; --line: #1f2830; --text: #d6e2ea;
    --dim: #7d8d99; --accent: #3ddc97; --warn: #ffb84d; --bad: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .08em; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .navlink { margin-left: auto; color: var(--text); text-decoration: none; font-size: 13px;
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .navlink:hover { border-color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .live .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .warn .dot { background: var(--warn); }
  .bad .dot { background: var(--bad); }
  main { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px;
    max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .video { position: relative; background: #000; border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .video img:not([src]) { visibility: hidden; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    background: rgba(0,0,0,.72); padding: 16px; }
  .overlay.show { display: flex; }
  .overlay p { margin: 0; color: var(--dim); max-width: 420px; }
  .overlay strong { font-size: 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04140d; border-color: var(--accent); font-weight: 600; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; color: var(--dim);
    text-transform: uppercase; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; text-align: right; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .big div { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .big span { display: block; font-size: 11px; color: var(--dim); }
  .big b { font-size: 22px; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: #04140d; font-weight: 600; }
  .spacer { flex: 1; }
  button.small { padding: 2px 8px; font-size: 12px; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 99px;
    padding: 2px 9px; font-size: 12px; }
  .chip b { color: var(--accent); }
  .objhead { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  #objList { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
  #objList li { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center;
    padding: 4px 2px; border-top: 1px solid var(--line); font-size: 13px; }
  #objList li .on { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #objList li.active .on { background: var(--accent); }
  #objList li .t { color: var(--dim); font-size: 12px; }
  #objList .empty { color: var(--dim); border: 0; display: block; padding: 8px 0; }
  .objfoot { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .small-link { margin-left: 0; font-size: 12px; padding: 2px 8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>LUCKFOX · RV1106</h1>
    <div class="sub">YOLOv8n live detection HUD</div>
  </div>
  <a class="navlink" id="docsLink" href="/docs/" hidden>Docs</a>
  <div id="pill" class="pill"><span class="dot"></span><span id="pillText">Connecting…</span></div>
</header>

<main>
  <section>
    <div class="video" id="videoBox">
      <img id="stream" alt="Live HUD stream">
      <div class="overlay" id="overlay">
        <strong id="ovTitle"></strong>
        <p id="ovText"></p>
        <button class="primary" id="ovButton"></button>
      </div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Overlay">
        <button id="viewHud" class="on">HUD</button>
        <button id="viewPlain">Plain</button>
      </div>
      <span class="spacer"></span>
      <button id="toggleBtn" title="Stopping ends the session and clears its object list">Stop</button>
      <button id="fullBtn">Fullscreen</button>
      <button id="snapBtn">Snapshot</button>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Objects this session</h2>
      <div class="objhead mono"><span id="objTotal">0 objects</span><span id="objTime">–</span></div>
      <div class="chips mono" id="objChips"></div>
      <ul id="objList" class="mono"><li class="empty">Nothing detected yet.</li></ul>
      <div class="objfoot">
        <span id="objShown" class="mono"></span>
        <span class="spacer"></span>
        <a href="/objects.html" target="_blank" rel="noopener" class="navlink small-link">View all</a>
        <button id="objReset" class="small" title="Clear this session's object list and counts">Reset</button>
      </div>
    </div>
    <div class="card">
      <h2>Pipeline</h2>
      <div class="big mono">
        <div><span>FPS</span><b id="fps">–</b></div>
        <div><span>Detections</span><b id="dets">–</b></div>
        <div><span>Inference</span><b id="infer">–</b></div>
        <div><span>JPEG encode</span><b id="jpeg">–</b></div>
      </div>
    </div>
    <div class="card">
      <h2>Board</h2>
      <dl class="mono">
        <dt>CPU</dt><dd id="cpu">–</dd>
        <dt>SoC temp</dt><dd id="temp">–</dd>
        <dt>Mem available</dt><dd id="mem">–</dd>
        <dt>Tilt</dt><dd id="tilt">–</dd>
        <dt>WiFi</dt><dd><span id="wifiState">–</span> <button id="wifiBtn" class="small" disabled>…</button></dd>
      </dl>
    </div>
    <div class="card">
      <h2>Stream</h2>
      <dl class="mono">
        <dt>Display</dt><dd id="res">–</dd>
        <dt>Inference</dt><dd id="model">–</dd>
        <dt>Source</dt><dd id="src">–</dd>
        <dt>Viewer</dt><dd id="viewer">–</dd>
        <dt>Frames</dt><dd id="frames">–</dd>
      </dl>
    </div>
  </aside>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const img = $('stream');
  const myId = Math.random().toString(36).slice(2, 12);

  // want: the user wants video in this tab. mode: what we show.
  let want = true, lastStart = 0;
  let lastFrame = -1, lastFrameChange = Date.now();

  function startStream() {
    lastStart = Date.now();
    lastFrame = -1; lastFrameChange = Date.now();
    img.src = '/stream?id=' + myId + '&t=' + Date.now();
  }
  function stopStream() {
    img.removeAttribute('src'); // closes the connection; the board goes idle
  }

  function setPill(cls, text) {
    $('pill').className = 'pill ' + cls;
    $('pillText').textContent = text;
  }
  function overlay(title, text, button, action) {
    const ov = $('overlay');
    if (!title) { ov.classList.remove('show'); return; }
    $('ovTitle').textContent = title;
    $('ovText').textContent = text || '';
    const b = $('ovButton');
    b.textContent = button; b.onclick = action;
    ov.classList.add('show');
  }

  function play() { want = true; $('toggleBtn').textContent = 'Stop'; overlay(null); startStream(); }
  function pause() {
    want = false; $('toggleBtn').textContent = 'Start'; stopStream();
    overlay('Stopped', 'The board stops processing while nobody is watching. The session object list was cleared.', 'Start', play);
  }

  async function setView(mode) {
    $('viewHud').classList.toggle('on', mode === 'hud');
    $('viewPlain').classList.toggle('on', mode === 'plain');
    try { await fetch('/api/view?mode=' + mode, { cache: 'no-store' }); } catch (e) {}
  }
  $('viewHud').onclick = () => setView('hud');
  $('viewPlain').onclick = () => setView('plain');

  $('toggleBtn').onclick = () => (want ? pause() : play());
  $('fullBtn').onclick = () => {
    const el = $('videoBox');
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  };
  $('snapBtn').onclick = () => {
    if (!img.naturalWidth) return;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.download = 'luckfox-' + new Date().toISOString().replace(/[:.]/g, '-') + '.jpg';
    a.href = c.toDataURL('image/jpeg', 0.92);
    a.click();
  };


  const fmt = (v, digits, unit) => (v == null || v < 0) ? '–' : v.toFixed(digits) + (unit || '');

  async function poll() {
    let s;
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      s = await r.json();
    } catch (e) {
      setPill('bad', 'Board offline');
      if (want) overlay('Board not reachable', 'Check the USB cable. This page reconnects by itself.', 'Retry now', play);
      return;
    }

    const mine = s.streaming && s.viewer_id === myId;
    if (want) {
      if (s.streaming && !mine && Date.now() - lastStart > 1500) {
        // someone else opened the stream after us: don't fight over it
        want = false; stopStream();
        $('toggleBtn').textContent = 'Start';
        setPill('warn', 'In use elsewhere');
        overlay('Stream in use', 'Another viewer (' + s.viewer_ip + ') has the stream. Only one viewer at a time.', 'Take over', play);
      } else if (!s.streaming && Date.now() - lastStart > 3000) {
        startStream(); // our stream dropped (board restarted, video looped): reconnect
      } else if (mine) {
        if (s.frame !== lastFrame) { lastFrame = s.frame; lastFrameChange = Date.now(); }
        else if (Date.now() - lastFrameChange > 6000) startStream(); // stalled
        setPill('live', 'Live');
        overlay(null);
      }
    }
    if (!want && !s.streaming) setPill('', 'Idle');

    $('fps').textContent = mine ? fmt(s.fps, 1) : '–';
    $('dets').textContent = mine ? s.dets : '–';
    $('infer').textContent = mine ? fmt(s.infer_ms, 0, ' ms') : '–';
    $('jpeg').textContent = mine ? fmt(s.jpeg_ms, 0, ' ms') : '–';
    $('cpu').textContent = fmt(s.cpu_pct, 0, ' %');
    $('temp').textContent = fmt(s.soc_temp_c, 1, ' °C');
    $('mem').textContent = fmt(s.mem_avail_mb, 0, ' MB');
    $('tilt').textContent = s.has_tilt
      ? 'P ' + (s.pitch > 0 ? '+' : '') + s.pitch.toFixed(0) + '°  R ' + (s.roll > 0 ? '+' : '') + s.roll.toFixed(0) + '°'
      : '–';
    $('res').textContent = s.display_w + '×' + s.display_h;
    $('model').textContent = s.model_size + '×' + s.model_size;
    $('src').textContent = s.source;
    $('viewer').textContent = s.streaming ? (mine ? 'you (' + s.viewer_ip + ')' : s.viewer_ip) : 'none';
    $('frames').textContent = s.streaming ? s.frame : '–';
    $('viewHud').classList.toggle('on', s.view === 'hud');
    $('viewPlain').classList.toggle('on', s.view === 'plain');
    if (mine) pollObjects(); else if (!want) renderObjects(null);
  }

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clock = (sec) => {
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  };

  function renderObjects(o) {
    if (!o) {
      $('objTotal').textContent = '0 objects'; $('objTime').textContent = '–';
      $('objChips').innerHTML = '';
      $('objList').innerHTML = '<li class="empty">No active session.</li>';
      return;
    }
    $('objTotal').textContent = o.total + (o.total === 1 ? ' object' : ' objects');
    $('objShown').textContent = o.total > o.objects.length ? 'latest ' + o.objects.length + ' of ' + o.total : '';
    $('objTime').textContent = 'session ' + clock(o.session_s);
    $('objChips').innerHTML = Object.entries(o.counts)
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => '<span class="chip">' + esc(k) + ' <b>' + v + '</b></span>').join('');
    $('objList').innerHTML = o.objects.length ? o.objects.map((x) =>
      '<li class="' + (x.active ? 'active' : '') + '">' +
        '<span class="on" title="' + (x.active ? 'in view' : 'gone') + '"></span>' +
        '<span>#' + x.id + ' ' + esc(x.cls) + '</span>' +
        '<span>' + Math.round(x.score * 100) + '%</span>' +
        '<span class="t">' + clock(x.first_s) + ' · ' + Math.max(0, x.last_s - x.first_s).toFixed(1) + 's</span>' +
      '</li>').join('') : '<li class="empty">Nothing detected yet.</li>';
  }

  $('objReset').onclick = async () => {
    if (!confirm('Clear the object list and counts for this session?')) return;
    try { renderObjects(await fetch('/api/objects/reset', { cache: 'no-store' }).then((r) => r.json())); } catch (e) {}
  };

  async function pollObjects() {
    try {
      const r = await fetch('/api/objects?limit=20', { cache: 'no-store' });
      renderObjects(await r.json());
    } catch (e) {}
  }

  // Only offer the Docs link when a docs site is installed on this board
  // (it's deployed separately into www/docs/, not part of this repo).
  fetch('/docs/', { cache: 'no-store' }).then((r) => { if (r.ok) $('docsLink').hidden = false; }).catch(() => {});

  // WiFi on/off (off by default at boot; the USB link always stays up)
  let wifiOn = false;
  async function wifi(query) {
    try {
      const w = await fetch('/api/wifi' + (query || ''), { cache: 'no-store' }).then((r) => r.json());
      if (!w.present) { $('wifiState').textContent = 'not present'; $('wifiBtn').hidden = true; return; }
      wifiOn = w.enabled;
      $('wifiState').textContent = w.enabled ? ('on' + (w.ip ? ' (' + w.ip + ')' : ', no IP yet')) : 'off';
      $('wifiBtn').textContent = w.enabled ? 'Turn off' : 'Turn on';
      $('wifiBtn').disabled = false;
    } catch (e) {}
  }
  $('wifiBtn').onclick = () => {
    $('wifiBtn').disabled = true; $('wifiState').textContent = 'switching…';
    wifi(wifiOn ? '?enable=0' : '?enable=1');
    setTimeout(wifi, 3000);
  };
  wifi();
  setInterval(wifi, 5000);

  play();
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
