Real-hardware notes on running YOLO detection on the Rockchip RV1106G3's ~1 TOPS NPU — served straight off the board itself.

Start with the [RV1106 NPU & YOLO guide](/docs/rv1106-npu-yolo-guide/) for the full technical breakdown: hardware, the RKNN toolchain, and why some YOLO generations run on this chip and others don't.
"""

